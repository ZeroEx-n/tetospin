<!DOCTYPE html>
<html lang='ru'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Teto Spin</title>
    <style>
        /* Настройки для всей страницы */
        body {
            background-color: #ffb6c1; /* Красивый нежно-розовый цвет */
            margin: 0;
            height: 100vh; /* Растягиваем на всю высоту экрана */
            display: flex;
            justify-content: center; /* Центрируем по горизонтали */
            align-items: center; /* Центрируем по вертикали */
            overflow: hidden; /* Убираем возможные полосы прокрутки */
        }
    </style>
</head>
<body>
    <img src="a.gif" alt="Spinning Teto">
    
    <audio id="myAudio" src="a.m4a" loop></audio>
    
    <script>
        const audio = document.getElementById('myAudio');
        
        // Музыка начнется при первом клике пользователя по экрану
        document.addEventListener('click', () => {
            audio.play().catch(error => {
                console.log("Автовоспроизведение заблокировано или файл не найден:", error);
            });
        }, { once: true });
    </script>
</body>
</html>
