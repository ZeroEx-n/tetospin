<!DOCTYPE html>
<html lang='ru'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Teto Spin</title>
    <style>
      
        
        body {
            background-color: #ffb6c1; 
            margin: 0;
            height: 100vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center; 
            overflow: hidden; 
            gap: 20px;
        }
 
        img {
            cursor: pointer;
            user-select: none;
        }
 
        .caption {
            font-family: 'Доброшрифт', cursive, sans-serif;
            font-size: 48px;
            color: #ffffff;
            text-shadow: 2px 2px 0 #ff69b4, -1px -1px 0 #ff69b4,
                         1px -1px 0 #ff69b4, -1px 1px 0 #ff69b4;
            margin: 0;
            letter-spacing: 2px;
            pointer-events: none; 
        }
    </style>
</head>
<body>
    <img id="teto" src="a.gif" alt="Spinning Teto">
    <p class="caption">touch her</p>
    <audio id="myAudio" src="a.m4a" loop></audio>
    <script>
        const audio = document.getElementById('myAudio');
        const teto = document.getElementById('teto');
 
       
        teto.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().catch(error => {
                    console.log("Автовоспроизведение заблокировано или файл не найден:", error);
                });
            }
        });
    </script>
</body>
</html>
