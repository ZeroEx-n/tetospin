<!DOCTYPE html>
<html lang='ru'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Teto Spin</title>
    <style>
       
        body {
            background-color: #ffb6c1; 
            margin: 0;
            height: 100vh; 
            display: flex;
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }
    </style>
</head>
<body>
    <img src="a.gif" alt="Spinning Teto">
    
    <audio id="myAudio" src="a.m4a" loop></audio>
    
    <script>
        const audio = document.getElementById('myAudio');
        
        
        document.addEventListener('click', () => {
            audio.play().catch(error => {
                console.log("Автовоспроизведение заблокировано или файл не найден:", error);
            });
        }, { once: true });
    </script>
</body>
</html>
